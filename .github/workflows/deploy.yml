name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        # npm ci es estricto y falla si el lockfile no resuelve las dependencias
        # opcionales de otras plataformas. Eso pasa cuando el lock se genera en
        # Windows, porque npm poda las variantes de Linux (las de sharp).
        # Si ocurre, se avisa y se continua con npm install en lugar de tumbar
        # el deploy. Para arreglarlo en local: npm run relock
        run: |
          npm ci || {
            echo "::warning::El lockfile no esta sincronizado. Se continua con npm install; ejecuta 'npm run relock' en local y commitea el lockfile."
            npm install --no-audit --no-fund
          }

      - name: Construir sitio Astro
        run: npm run build

      - name: Subir a GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy con GitHub Pages
        uses: actions/deploy-pages@v4
